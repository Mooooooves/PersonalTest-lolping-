name: Build Windows installer

# Builds lolPing-Setup-<version>.exe from the sources in this repository, on GitHub's own
# Windows runner -- nothing is built on a developer machine.
#
# The installer is published twice over:
#   * as a workflow artifact, downloadable from the run's page for 30 days;
#   * attached to a GitHub Release, when the run was started by pushing a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci installs from package-lock.json alone, so the build needs no network
      # access beyond the registry and no local package-manager shims.
      - run: npm ci

      # Compiles native/hook-helper/src/*.cpp into hook-helper.exe with the MSVC
      # toolchain that ships on windows-latest. electron-builder later copies that
      # file into the installer as an extraResource.
      - run: npm run build:helper

      - run: npm run typecheck
      - run: npm test

      # electron-vite build + electron-builder --win --publish never
      - run: npm run dist

      - name: Show what was produced
        run: Get-ChildItem release

      - uses: actions/upload-artifact@v4
        with:
          name: lolPing-Setup-windows-x64
          path: |
            release/lolPing-Setup-*.exe
            release/lolPing-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

      # Only on a tag: attach the same files to a Release so they can be downloaded
      # without unpacking a zip.
      - name: Attach the installer to a Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "lolPing $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "release/lolPing-Setup-${version}.exe" \
            "release/lolPing-Setup-${version}.exe.blockmap" \
            "release/latest.yml" \
            --clobber
